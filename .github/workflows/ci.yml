name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,viz,api]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # The benchmark data is not committed, so this job is the check that the
  # fetch script and the parser still agree with what OR-Library serves. It
  # runs a handful of instances, not the full 700 -- the point is that the
  # pipeline works, not to re-measure it on every push.
  benchmark:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Fetch datasets
        run: python -m tools.fetch_datasets
      - name: Verify checksums are unchanged
        run: python -m tools.fetch_datasets --verify
      - name: Smoke benchmark
        run: python -m bench.run_bench --sets BR1 BR7 --limit 5

  # Builds the image and proves the assembled thing answers, which is more than
  # "the Dockerfile parses": the viewer has to be served from the API's own
  # origin without shadowing any route.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: loadza:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run it and drive it
        run: |
          docker run -d --name loadza -p 8000:8000 loadza:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && break
            sleep 2
          done
          curl -sf localhost:8000/health
          curl -sf localhost:8000/catalog > /dev/null
          # The viewer, served from the API's root.
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          # And a job solved end to end inside the container.
          curl -sf -X POST localhost:8000/jobs \
            -H 'content-type: application/json' \
            --data-binary @data/demo/CNT-20DV-cartons-s13.json > /dev/null
          curl -sf -X POST localhost:8000/jobs/CNT-20DV-cartons-s13/solve \
            -H 'content-type: application/json' -d '{}' | tee /tmp/plan.json
          grep -q '"K1": *0' /tmp/plan.json
      - name: Logs on failure
        if: failure()
        run: docker logs loadza

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
