name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,viz,api]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # The benchmark data is not committed, so this job is the check that the
  # fetch script and the parser still agree with what OR-Library serves. It
  # runs a handful of instances, not the full 700 -- the point is that the
  # pipeline works, not to re-measure it on every push.
  benchmark:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Fetch datasets
        run: python -m tools.fetch_datasets
      - name: Verify checksums are unchanged
        run: python -m tools.fetch_datasets --verify
      - name: Smoke benchmark
        run: python -m bench.run_bench --sets BR1 BR7 --limit 5

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
