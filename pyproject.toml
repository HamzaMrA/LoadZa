[project]
name = "loadza"
version = "0.1.0"
description = "3D container loading optimisation: heuristic placement, physical validation, 3D visualisation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "httpx>=0.27"]
# Only tools/view.py needs this. core/ stays dependency-free.
viz = ["matplotlib>=3.8"]
# Only app/ needs these.
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "tools", "bench", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
