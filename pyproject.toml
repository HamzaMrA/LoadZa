[project]
name = "loadza"
version = "0.1.0"
description = "3D container loading optimisation: heuristic placement, physical validation, 3D visualisation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
